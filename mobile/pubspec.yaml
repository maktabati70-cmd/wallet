name: tron_wallet
description: Non-custodial USDT (TRC20) wallet for Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'   # Flutter 3.27+

dependencies:
  flutter:
    sdk: flutter
  # Key generation / derivation (BIP39 + BIP32/BIP44 m/44'/195'/0'/0/0)
  bip39: ^1.0.6
  bip32: ^2.0.0
  pointycastle: ^3.9.1      # secp256k1, Keccak-256, PBKDF2
  crypto: ^3.0.3            # SHA-256 for Base58Check
  # Device security
  flutter_secure_storage: ^9.2.2   # Android Keystore-backed storage
  local_auth: ^2.3.0               # biometric unlock
  # UI / networking
  http: ^1.2.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
